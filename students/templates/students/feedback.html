{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="{% static 'css/feedback.css' %}">
</head>
<body>
    <nav class="sidebar">
        <a href="{% url 'student_dashboard' %}"><img src="{% static 'images/Home.svg' %}" alt="home_icon" class="sidebar-icon"></a>
        <a href="{% url 'profile' %}"><img src="{% static 'images/Selected_user.svg' %}" alt="profile_icon" class="sidebar-icon-active"></a>
        <a href="{% url 'sessions' %}"><img src="{% static 'images/Session.svg' %}" alt="sessions_icon" class="sidebar-icon"></a>
        <a href="{% url 'find_sessions' %}"><img src="{% static 'images/findsession.svg' %}" alt="find_sessions_icon" class="sidebar-icon"></a>
        <a href="{% url 'library' %}"><img src="{% static 'images/Material.svg' %}" alt="library_icon" class="sidebar-icon"></a>
    </nav>

    <div class="adjust_ellipse">
        <img src="{% static 'images/Ellipse2.svg' %}" alt="ellipse2">
        <div class="adjust_avatar"><img src="{% static 'images/avatar.svg' %}"  alt="avatar"></div>
    </div>

    <div class="notify_curve">
        <img id="notifyBtn" src="{% static 'images/notify_curve.svg' %}" alt="curve">  
    </div>

    <!-- NOTIFICATION POPUP -->
    <div id="notificationBox" class="notification-box hidden">
        <div class="notify-header">
            <span>Notifications</span>
            <span class="checkmark">
                <img src="{% static 'images/check-mark.svg' %}" alt="check_mark">
            </span>
        </div>

        <div class="notify-body">
            You have no notifications
        </div>

        <div class="notify-footer">
            <a href="#">See all</a>
        </div>
    </div>

    <div class="main-content">
        <div class="review-header">Leave review about your session</div>
        
        <div class="star-rating" id="starRating">
            <div class="star" data-rating="1"></div>
            <div class="star" data-rating="2"></div>
            <div class="star" data-rating="3"></div>
            <div class="star" data-rating="4"></div>
            <div class="star" data-rating="5"></div>
        </div>

        <textarea class="review-textarea" id="reviewText" maxlength="150" placeholder="Viết đánh giá của bạn..."></textarea>
        
        <div class="note-text">Note: maximum 150 words, and you cannot edit after submitting it.</div>
        
        <div class="button-container">
            <div class="left-buttons">
                <button class="btn btn-submit" onclick="submitReview()">submit</button>
                <button class="btn btn-clear" onclick="clearForm()">clear</button>
            </div>
            <button class="btn btn-cancel" onclick="cancelReview()">Cancel</button>
        </div>
    </div>

    <div class="footer">
        <a href="{% url 'technical_report' %}">Technical Support</a>
    </div>
    
    <script>
        let selectedRating = 0;
        const stars = document.querySelectorAll('.star');
        const textarea = document.getElementById('reviewText');

        stars.forEach(star => {
            star.addEventListener('click', function() {
                selectedRating = parseInt(this.dataset.rating);
                updateStars();
            });
        });

        function updateStars() {
            stars.forEach(star => {
                const rating = parseInt(star.dataset.rating);
                if (rating <= selectedRating) {
                    star.classList.add('active');
                } else {
                    star.classList.remove('active');
                }
            });
        }

        function submitReview() {
            if (selectedRating === 0) {
                alert('Please select a star rating!');
                return;
            }
            
            const reviewText = textarea.value.trim();
            if (reviewText === '') {
                alert('Vui lòng viết đánh giá của bạn!');
                return;
            }
            
            alert(`Your rating:\nNumber of stars: ${selectedRating}\n\nThank you for your review!`);
        }

        function clearForm() {
            selectedRating = 0;
            updateStars();
            textarea.value = '';
        }

        function cancelReview() {
            if (confirm('Are you sure you want to cancel the review?')) {
                clearForm();
            }
        }

        const notifyBtn = document.getElementById("notifyBtn");
        const notificationBox = document.getElementById("notificationBox");

        notifyBtn.addEventListener("click", function() {
            notificationBox.classList.toggle("hidden");
        });

        // Click outside to close
        document.addEventListener("click", function(e) {
            if (!notificationBox.contains(e.target) && e.target !== notifyBtn) {
                notificationBox.classList.add("hidden");
            }
        });
    </script>
</body>
</html>
