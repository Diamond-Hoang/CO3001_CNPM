{% extends 'student_base.html' %}
{% load static %}

{% block title %}<title>Request Session</title>{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/request_session.css' %}">
{% endblock %}

{% block content %}

<div class="main-content">
    <div class="page-header">Request New Session</div>
    
    <div class="form-container">
        <form id="sessionForm">
            <div class="form-group">
                <input type="text" class="form-input" id="subject" placeholder="Subject" required>
            </div>

            <div class="form-group">
                <select class="form-select" id="deliveryMode" required>
                    <option value="" disabled selected>Select delivery mode</option>
                    <option value="online">Online</option>
                    <option value="offline">Offline</option>
                    <option value="hybrid">Hybrid</option>
                </select>
            </div>

            <div class="form-row">
                <input type="date" class="form-input" id="date" placeholder="Date" required>
                <input type="time" class="form-input" id="startTime" placeholder="Start time" required>
                <input type="time" class="form-input" id="endTime" placeholder="End time" required>
            </div>

            <div class="button-container">
                <button type="submit" class="btn-request">Request</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
<script>
    const form = document.getElementById('sessionForm');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const subject = document.getElementById('subject').value;
            const deliveryMode = document.getElementById('deliveryMode').value;
            const date = document.getElementById('date').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            
            if (!subject || !deliveryMode || !date || !startTime || !endTime) {
                alert('Please fill in all information!');
                return;
            }
            
            if (startTime >= endTime) {
                alert('End time must be after start time!');
                return;
            }
            
            alert(`Your request session has been sent!\n\nSubject: ${subject}\nCourse format: ${deliveryMode}\nDate: ${date}\nTime: ${startTime} - ${endTime}`);
            
            form.reset();
        });
        
        // Set minimum date to today
        const dateInput = document.getElementById('date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);

</script>
{% block extra_js %}

{% endblock %}
