{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request New Session</title>
    <link rel="stylesheet" href="{% static 'css/request_session.css' %}">
</head>
<body>
    <nav class="sidebar">
        <a href="{% url 'student_dashboard' %}"><img src="{% static 'images/Home.svg' %}" alt="home_icon" class="sidebar-icon"></a>
        <a href="{% url 'profile' %}"><img src="{% static 'images/Selected_user.svg' %}" alt="profile_icon" class="sidebar-icon-active"></a>
        <a href="{% url 'sessions' %}"><img src="{% static 'images/Session.svg' %}" alt="sessions_icon" class="sidebar-icon"></a>
        <a href="{% url 'find_sessions' %}"><img src="{% static 'images/findsession.svg' %}" alt="find_sessions_icon" class="sidebar-icon"></a>
        <a href="{% url 'library' %}"><img src="{% static 'images/Material.svg' %}" alt="library_icon" class="sidebar-icon"></a>
    </nav>

    <div class="adjust_ellipse">
        <img src="{% static 'images/Ellipse2.svg' %}" alt="ellipse2">
        <div class="adjust_avatar"><img src="{% static 'images/avatar.svg' %}"  alt="avatar"></div>
    </div>

    <div class="notify_curve">
        <img id="notifyBtn" src="{% static 'images/notify_curve.svg' %}" alt="curve">  
    </div>

    <!-- NOTIFICATION POPUP -->
    <div id="notificationBox" class="notification-box hidden">
        <div class="notify-header">
            <span>Notifications</span>
            <span class="checkmark">
                <img src="{% static 'images/check-mark.svg' %}" alt="check_mark">
            </span>
        </div>

        <div class="notify-body">
            You have no notifications
        </div>

        <div class="notify-footer">
            <a href="#">See all</a>
        </div>
    </div>

    <div class="main-content">
        <div class="page-header">Request New Session</div>
        
        <div class="form-container">
            <form id="sessionForm">
                <div class="form-group">
                    <input type="text" class="form-input" id="subject" placeholder="Subject" required>
                </div>

                <div class="form-group">
                    <select class="form-select" id="deliveryMode" required>
                        <option value="" disabled selected>Select delivery mode</option>
                        <option value="online">Online</option>
                        <option value="offline">Offline</option>
                        <option value="hybrid">Hybrid</option>
                    </select>
                </div>

                <div class="form-row">
                    <input type="date" class="form-input" id="date" placeholder="Date" required>
                    <input type="time" class="form-input" id="startTime" placeholder="Start time" required>
                    <input type="time" class="form-input" id="endTime" placeholder="End time" required>
                </div>

                <div class="button-container">
                    <button type="submit" class="btn-request">Request</button>
                </div>
            </form>
        </div>
    </div>

    <div class="footer">
        <a href="{% url 'technical_report' %}">Technical Support</a>
    </div>

    <script>
        const form = document.getElementById('sessionForm');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const subject = document.getElementById('subject').value;
            const deliveryMode = document.getElementById('deliveryMode').value;
            const date = document.getElementById('date').value;
            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;
            
            if (!subject || !deliveryMode || !date || !startTime || !endTime) {
                alert('Please fill in all information!');
                return;
            }
            
            if (startTime >= endTime) {
                alert('End time must be after start time!');
                return;
            }
            
            alert(`Your request session has been sent!\n\nSubject: ${subject}\nCourse format: ${deliveryMode}\nDate: ${date}\nTime: ${startTime} - ${endTime}`);
            
            form.reset();
        });
        
        // Set minimum date to today
        const dateInput = document.getElementById('date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);

        const notifyBtn = document.getElementById("notifyBtn");
        const notificationBox = document.getElementById("notificationBox");

        notifyBtn.addEventListener("click", function() {
            notificationBox.classList.toggle("hidden");
        });

        // Click outside to close
        document.addEventListener("click", function(e) {
            if (!notificationBox.contains(e.target) && e.target !== notifyBtn) {
                notificationBox.classList.add("hidden");
            }
        });
    </script>
</body>
</html>
