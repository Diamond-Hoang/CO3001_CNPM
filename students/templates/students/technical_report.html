{% load static %}
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Technical Problem</title>
    <link rel="stylesheet" href="{% static 'css/technical_report.css' %}">
</head>
<body>
    <nav class="sidebar">
        <a href="{% url 'student_dashboard' %}"><img src="{% static 'images/Home.svg' %}" alt="home_icon" class="sidebar-icon"></a>
        <a href="{% url 'profile' %}"><img src="{% static 'images/Selected_user.svg' %}" alt="profile_icon" class="sidebar-icon-active"></a>
        <a href="{% url 'sessions' %}"><img src="{% static 'images/Session.svg' %}" alt="sessions_icon" class="sidebar-icon"></a>
        <a href="{% url 'find_sessions' %}"><img src="{% static 'images/findsession.svg' %}" alt="find_sessions_icon" class="sidebar-icon"></a>
        <a href="{% url 'library' %}"><img src="{% static 'images/Material.svg' %}" alt="library_icon" class="sidebar-icon"></a>
    </nav>

    <div class="adjust_ellipse">
        <img src="{% static 'images/Ellipse2.svg' %}" alt="ellipse2">
        <div class="adjust_avatar"><img src="{% static 'images/avatar.svg' %}"  alt="avatar"></div>
    </div>

    <div class="notify_curve">
        <img id="notifyBtn" src="{% static 'images/notify_curve.svg' %}" alt="curve">  
    </div>

    <!-- NOTIFICATION POPUP -->
    <div id="notificationBox" class="notification-box hidden">
        <div class="notify-header">
            <span>Notifications</span>
            <span class="checkmark">
                <img src="{% static 'images/check-mark.svg' %}" alt="check_mark">
            </span>
        </div>

        <div class="notify-body">
            You have no notifications
        </div>

        <div class="notify-footer">
            <a href="#">See all</a>
        </div>
    </div>

    <div class="main-content">
        <div class="page-header">Report your technical problem</div>
        
        <textarea class="report-textarea" id="problemText" maxlength="150" placeholder="Mô tả vấn đề kỹ thuật của bạn..."></textarea>
        
        <div class="note-text">Note: maximum 150 words, and you cannot edit after submitting it.</div>
        
        <div class="button-container">
            <div class="left-buttons">
                <button class="btn btn-submit" onclick="submitReport()">submit</button>
                <button class="btn btn-clear" onclick="clearForm()">clear</button>
            </div>
            <button class="btn btn-cancel" onclick="cancelReport()">Cancel</button>
        </div>
    </div>

    <div class="footer">
        <a href="{% url 'technical_report' %}">Technical Support</a>
    </div>
    
    <script>
        const textarea = document.getElementById('problemText');

        function submitReport() {
            const problemText = textarea.value.trim();
            
            if (problemText === '') {
                alert('Please describe your technical problem!');
                return;
            }
            
            alert(`Technical issue report sent! \nThank you for reporting. We will process it as soon as possible.`);
            
            clearForm();
        }

        function clearForm() {
            textarea.value = '';
        }

        function cancelReport() {
            if (textarea.value.trim() !== '') {
                if (confirm('Are you sure you want to cancel the report? The entered content will be deleted.')) {
                    clearForm();
                }
            } else {
                clearForm();
            }
        }

        // Hiển thị số ký tự còn lại (tùy chọn)
        textarea.addEventListener('input', function() {
            const remaining = 150 - this.value.length;
            if (remaining < 20) {
                console.log(`Còn ${remaining} ký tự`);
            }
        });

        const notifyBtn = document.getElementById("notifyBtn");
        const notificationBox = document.getElementById("notificationBox");

        notifyBtn.addEventListener("click", function() {
            notificationBox.classList.toggle("hidden");
        });

        // Click outside to close
        document.addEventListener("click", function(e) {
            if (!notificationBox.contains(e.target) && e.target !== notifyBtn) {
                notificationBox.classList.add("hidden");
            }
        });

    </script>
</body>
</html>
