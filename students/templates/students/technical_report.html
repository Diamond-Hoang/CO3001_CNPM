<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Technical Problem</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
            background-color: #e8e8e8;
        }

        .sidebar {
            width: 85px;
            background-color: #0033a0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        .user-avatar {
            width: 60px;
            height: 60px;
            background-color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .user-icon {
            width: 40px;
            height: 40px;
            background-color: #a0a0a0;
            border-radius: 50%;
            position: relative;
        }

        .user-icon::before {
            content: '';
            width: 18px;
            height: 18px;
            background-color: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
        }

        .user-icon::after {
            content: '';
            width: 28px;
            height: 20px;
            background-color: #ffffff;
            border-radius: 50% 50% 0 0;
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-icon {
            width: 40px;
            height: 40px;
            margin: 15px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-icon svg {
            width: 32px;
            height: 32px;
            fill: #ffffff;
            stroke: #ffffff;
        }

        .main-content {
            flex: 1;
            padding: 40px 60px;
            position: relative;
        }

        .notification-icon {
            position: absolute;
            top: 20px;
            right: 40px;
            width: 35px;
            height: 35px;
            cursor: pointer;
        }

        .notification-icon svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #0033a0;
            stroke-width: 2;
        }

        .page-header {
            background-color: #0033a0;
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 20px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 25px;
        }

        .report-textarea {
            width: 100%;
            height: 360px;
            background-color: #f9f2a1;
            border: none;
            padding: 20px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            resize: none;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .report-textarea:focus {
            outline: none;
        }

        .note-text {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .button-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .left-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 35px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.3s;
        }

        .btn:hover {
            opacity: 0.8;
        }

        .btn-submit {
            background-color: #4169e1;
            color: white;
        }

        .btn-clear {
            background-color: #5b8fd4;
            color: white;
        }

        .btn-cancel {
            background-color: transparent;
            color: #0033a0;
            text-decoration: underline;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="user-avatar">
            <div class="user-icon"></div>
        </div>
        
        <div class="nav-icon">
            <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </svg>
        </div>
        
        <div class="nav-icon">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"/>
                <path d="M6 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
            </svg>
        </div>
        
        <div class="nav-icon">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
        </div>
        
        <div class="nav-icon">
            <svg viewBox="0 0 24 24">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
        </div>
        
        <div class="nav-icon">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
                <text x="12" y="17" text-anchor="middle" font-size="8" fill="white">+</text>
            </svg>
        </div>
    </div>

    <div class="main-content">
        <div class="notification-icon">
            <svg viewBox="0 0 24 24">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
        </div>

        <div class="page-header">Report your technical problem</div>
        
        <textarea class="report-textarea" id="problemText" maxlength="150" placeholder="Mô tả vấn đề kỹ thuật của bạn..."></textarea>
        
        <div class="note-text">Note: maximum 150 words, and you cannot edit after submitting it.</div>
        
        <div class="button-container">
            <div class="left-buttons">
                <button class="btn btn-submit" onclick="submitReport()">submit</button>
                <button class="btn btn-clear" onclick="clearForm()">clear</button>
            </div>
            <button class="btn btn-cancel" onclick="cancelReport()">Cancel</button>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('problemText');

        function submitReport() {
            const problemText = textarea.value.trim();
            
            if (problemText === '') {
                alert('Vui lòng mô tả vấn đề kỹ thuật của bạn!');
                return;
            }
            
            alert(`Báo cáo vấn đề kỹ thuật đã được gửi!\n\nNội dung:\n${problemText}\n\nCảm ơn bạn đã báo cáo. Chúng tôi sẽ xử lý sớm nhất có thể.`);
            
            clearForm();
        }

        function clearForm() {
            textarea.value = '';
        }

        function cancelReport() {
            if (textarea.value.trim() !== '') {
                if (confirm('Bạn có chắc muốn hủy báo cáo? Nội dung đã nhập sẽ bị xóa.')) {
                    clearForm();
                }
            } else {
                clearForm();
            }
        }

        // Hiển thị số ký tự còn lại (tùy chọn)
        textarea.addEventListener('input', function() {
            const remaining = 150 - this.value.length;
            if (remaining < 20) {
                console.log(`Còn ${remaining} ký tự`);
            }
        });
    </script>
</body>
</html>
