{% extends 'student_base.html' %}
{% load static %}

{% block title %}Dashboard{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
{% endblock %}

{% block content %}

<div class="main-content">
    <div class="section">
        <h2>Today Sessions</h2>
        <div class="card">
            <div class="session-item session-blue"></div>
            <div class="session-item session-green"></div>
            <div class="session-item session-mint"></div>
            <div class="session-item session-pink"></div>
            <div class="session-item session-peach"></div>
        </div>
    </div>

    <div class="section">
        <h2>Advising Sessions</h2>
        <div class="card">
            <div class="session-item session-green"></div>
            <div class="session-item session-light-blue"></div>
            <div class="session-item session-light-pink"></div>
            <div class="session-item session-light-purple"></div>
            <div class="session-item session-mint"></div>
        </div>
    </div>
</div>

{% endblock %}
